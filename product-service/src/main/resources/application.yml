# 服务器配置
server:
  port: 8082  # 商品服务端口

# Spring配置
spring:
  application:
    name: product-service  # 服务名称，用于注册到Nacos

  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/product_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: zyy
    password: zxcvzxcv
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update  # 自动更新表结构
    show-sql: true      # 显示SQL语句
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL5Dialect

  redis:
    host: localhost
    port: 6379
    database: 1  # 可以为不同服务使用不同的数据库

  # Nacos配置
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848  # Nacos服务器地址

# 日志配置
logging:
  level:
    com.example.productservice: DEBUG