server:
  port: 8083

spring:
  application:
    name: order-service
  
  datasource:
    # 关键修改：使用 p6spy 驱动前缀
    url: jdbc:p6spy:mysql://localhost:3306/order_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: zyy
    password: zxcvzxcv
    # 关键修改：使用 p6spy 驱动
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: update
    # 关闭 Hibernate 自带的 SQL 日志，避免重复输出
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL5Dialect
        format_sql: false

  redis:
    host: localhost
    port: 6379
    database: 1

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

  feign:
    client:
      config:
        default:
          connectTimeout: 5000
          readTimeout: 5000
    hystrix:
      enabled: false
    okhttp:
      enabled: true
    httpclient:
      enabled: false



# 日志配置（p6spy 专用）
logging:
  level:
    # 您的应用日志级别
    com.example.orderservice: DEBUG
    # 关闭 Hibernate 相关日志，避免重复
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
    org.hibernate.type: OFF
    # 关键：开启 p6spy 日志
    p6spy: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"